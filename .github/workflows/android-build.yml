# Build the Android edition (release-signed APK) on GitHub's runners.
#
# The Muse VM cannot run Gradle: its Java daemon traffic over local TCP
# is blocked there, so the build runs here instead, where Gradle works
# normally. Dispatch-only on purpose — it never runs on push, so it
# cannot surprise a release. It only builds and uploads the APK as a
# run artifact; creating a GitHub release from that APK is a separate,
# manual step, so the shared-version rule (one release carrying both
# the APK and the HTML edition) stays intact.
#
# Signing (2026-10-31): the APK is signed with ONE dedicated key
# (GitHub secrets ANDROID_KEYSTORE_BASE64 / _PASSWORD / _ALIAS /
# _KEY_PASSWORD), not a per-runner debug key. Every CI build from
# now on therefore carries the same signature, so updates install
# over each other. The first release with this key still needs one
# uninstall to get off the debug-signed v1.3.13, after which
# install-over works.
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # No setup-android step on purpose: the first attempt used it and
      # failed in its own sdkmanager license prompt. GitHub's
      # ubuntu-latest runners already ship an Android SDK (ANDROID_HOME
      # is set by the image), and Gradle picks that up directly.
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/toolbox-release.keystore"
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/toolbox-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Toolbox-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
